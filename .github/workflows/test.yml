name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pillow is optional: 3.13 covers format conversion, 3.11 covers the standard-library-only path.
      - if: matrix.python == '3.13'
        run: python -m pip install -r skill/requirements.txt
      - run: python tests/test_imagegen.py
      - run: python tests/test_install.py

  # Distribution Python without ensurepip (no python3-venv), the common Debian/Ubuntu server setup.
  debian-system-python:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
      - uses: actions/checkout@v4
      - run: python3 tests/test_imagegen.py
      - run: python3 tests/test_install.py
